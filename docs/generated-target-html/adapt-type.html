<!DOCTYPE html>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:1605px;height:1125px;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#fff}
.page{position:relative;width:1605px;height:1125px;background:#020303}
.sidebar{position:absolute;left:0;top:0;width:108px;height:1125px;background:#050607;border-right:1px solid rgba(255,255,255,.01)}
.logo{position:absolute;left:39px;top:52px;width:31px;height:24px}
.logo:before{content:"";position:absolute;left:0;top:0;width:30px;height:6px;background:#595b5f;border-radius:6px;box-shadow:0 10px 0 #595b5f}
.logo:after{content:"";position:absolute;right:0;bottom:0;width:22px;height:6px;background:#595b5f;border-radius:6px}
.nav{position:absolute;left:0;top:145px;width:108px}
.nav-item{position:relative;width:108px;height:62px;margin-bottom:0;color:#3d3f43}
.nav-item svg{position:absolute;left:39px;top:18px;width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{height:58px;margin-top:12px;margin-bottom:18px}
.nav-item.active .active-bg{position:absolute;left:24px;top:0;width:59px;height:58px;background:#55575b;border-radius:7px}
.nav-item.active svg{color:#060708;left:39px;top:15px}
.separator{position:absolute;left:24px;top:357px;width:59px;height:1px;background:#1b1c1f}
.bottom-score{position:absolute;left:27px;bottom:113px;font-size:23px;line-height:25px;color:#57595d;font-weight:700;letter-spacing:-1px}
.bottom-score small{font-size:12px;margin-left:1px}
.avatar{position:absolute;left:29px;bottom:19px;width:51px;height:51px;border-radius:50%;background:
radial-gradient(circle at 55% 42%,#d09b4d 0 8px,transparent 9px),
radial-gradient(circle at 45% 42%,#1e1a17 0 18px,transparent 19px),
linear-gradient(135deg,#141719,#070808);border:1px solid #141517;overflow:hidden}

.main{position:absolute;left:108px;top:0;width:1497px;height:1125px;background:
repeating-linear-gradient(135deg,rgba(255,255,255,.021) 0px,rgba(255,255,255,.021) 1px,transparent 1px,transparent 7px),
#020303;border-top-left-radius:0}
.main:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55);pointer-events:none}
.title{position:absolute;left:30px;top:45px;font-size:29px;font-weight:700;color:#56606b;letter-spacing:-1px;z-index:2}
.search{position:absolute;left:522px;top:37px;width:449px;height:52px;border-radius:8px;background:#080909;border:1px solid #111316;z-index:2}
.search span{position:absolute;left:14px;top:13px;font-size:18px;color:#303237;letter-spacing:.5px}
.search .glass{position:absolute;right:11px;top:10px;width:31px;height:31px;border-radius:7px;border:1px solid #202329}
.search .glass:before{content:"";position:absolute;left:8px;top:7px;width:10px;height:10px;border:2px solid #25282d;border-radius:50%}
.search .glass:after{content:"";position:absolute;left:18px;top:18px;width:8px;height:2px;background:#25282d;transform:rotate(45deg);border-radius:2px}
.help{position:absolute;right:64px;top:56px;font-size:16px;color:#52565e;z-index:2}
.choice-modal{position:absolute;left:384px;top:331px;width:837px;height:466px;border-radius:6px;border:3px solid #25262c;background:#111;overflow:hidden;z-index:5;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.choice-modal svg{display:block;width:100%;height:100%}
.note{position:absolute;left:0;right:0;bottom:29px;text-align:center;font-size:16px;color:#30343b;z-index:2}
.note:before{content:"ⓘ";font-size:18px;margin-right:7px;color:#343841}
.bot{position:absolute;right:53px;top:807px;width:65px;height:68px;z-index:3;opacity:.68}
.bot .head{position:absolute;left:6px;top:20px;width:54px;height:41px;background:#352072;border-radius:24px;box-shadow:0 0 13px rgba(91,57,203,.45)}
.bot .face{position:absolute;left:13px;top:27px;width:40px;height:25px;background:#1d1e25;border-radius:14px;border:3px solid #47308c}
.bot .eye{position:absolute;top:36px;width:6px;height:6px;border-radius:50%;background:#8170c9}
.bot .eye.l{left:24px}.bot .eye.r{right:22px}
.bot .mouth{position:absolute;left:29px;top:47px;width:13px;height:3px;border-radius:4px;background:#7565b7}
.bot .ant{position:absolute;left:32px;top:5px;width:4px;height:19px;background:#4d3b86;border-radius:3px}
.bot .ant:before{content:"";position:absolute;left:-4px;top:-7px;width:12px;height:12px;border-radius:50%;background:#574594}
.bot .ear{position:absolute;top:35px;width:8px;height:16px;border:2px solid #47308c;border-radius:8px}
.bot .ear.l{left:2px}.bot .ear.r{right:0}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.08);z-index:4;pointer-events:none}

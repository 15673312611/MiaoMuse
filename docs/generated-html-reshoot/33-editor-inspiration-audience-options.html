<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=2050, height=968, initial-scale=1.0" />
<title>灵感策划</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:2050px;
    height:968px;
    overflow:hidden;
    background:#020202;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    color:#fff;
  }
  .page{
    position:relative;
    width:2050px;
    height:968px;
    overflow:hidden;
    background:
      repeating-linear-gradient(132deg,
        rgba(255,255,255,.035) 0px,
        rgba(255,255,255,.035) 1px,
        transparent 1px,
        transparent 6px),
      #020202;
  }
  .header-title{
    position:absolute;
    left:78px;
    top:39px;
    font-size:26px;
    line-height:34px;
    font-weight:800;
    color:#f4f7ff;
    letter-spacing:.2px;
  }
  .top-right{
    position:absolute;
    right:78px;
    top:45px;
    display:flex;
    align-items:center;
    gap:36px;
    font-size:14px;
    color:#f1f3f7;
    white-space:nowrap;
  }
  .hot{
    display:flex;
    align-items:center;
    gap:6px;
    color:#d9dbe1;
    font-weight:500;
  }
  .hot svg{
    width:19px;
    height:22px;
    display:block;
  }
  .skip{
    color:#ffffff;
    font-weight:600;
  }

  .main{
    position:absolute;
    left:0;
    top:0;
    width:2050px;
    height:968px;
  }
  .title{
    position:absolute;
    top:329px;
    left:0;
    width:2050px;
    text-align:center;
    font-size:31px;
    line-height:40px;
    font-weight:800;
    letter-spacing:.4px;
    background:linear-gradient(90deg,#6f55e9 36%,#e05293 62%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subtitle{
    position:absolute;
    top:389px;
    left:0;
    width:2050px;
    text-align:center;
    color:#c6cbd5;
    font-size:24px;
    line-height:32px;
    font-weight:700;
    letter-spacing:.2px;
  }

  .input-card{
    position:absolute;
    left:598px;
    top:451px;
    width:837px;
    height:151px;
    border-radius:24px;
    background:#191a1f;
    border:1px solid rgba(199,210,230,.84);
    box-shadow:0 0 0 1px rgba(98,105,120,.32) inset;
  }
  .placeholder{
    position:absolute;
    left:21px;
    top:20px;
    color:#7f89a1;
    font-size:15px;
    line-height:22px;
    font-weight:500;
    letter-spacing:.1px;
  }
  .toolbar{
    position:absolute;
    left:16px;
    bottom:14px;
    height:25px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .tool{
    display:flex;
    align-items:center;
    gap:4px;
    height:22px;
    color:#eef1f7;
    font-size:13px;
    line-height:20px;
    font-weight:700;
    white-space:nowrap;
  }
  .tool.active{
    padding:1px 7px 1px 6px;
    border-radius:3px;
    background:#343743;
  }
  .tool svg{
    width:13px;
    height:13px;
    stroke:#e7eaf2;
    fill:none;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
    flex:0 0 auto;
  }
  .tool .fill{
    fill:#e7eaf2;
    stroke:none;
  }
  .tool .chev{
    width:8px;
    height:8px;
    margin-left:-2px;
  }

  .start-btn{
    position:absolute;
    right:11px;
    bottom:12px;
    width:115px;
    height:31px;
    border-radius:16px;
    background:linear-gradient(90deg,rgba(105,80,187,.78),rgba(156,70,117,.82));
    color:rgba(232,218,239,.56);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:13px;
    font-weight:700;
  }
  .start-btn svg{
    width:15px;
    height:15px;
    stroke:rgba(232,218,239,.56);
    fill:none;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .coin{
    width:13px;
    height:13px;
    border-radius:50%;
    background:rgba(255,255,255,.22);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    color:rgba(232,218,239,.52);
    margin-left:0;
  }

  .dropdown{
    position:absolute;
    left:615px;
    top:594px;
    width:100px;
    height:95px;
    background:#1e1f25;
    border-radius:4px;
    box-shadow:0 8px 18px rgba(0,0,0,.25);
    overflow:hidden;
  }
  .dropdown:after{
    content:"";
    position:absolute;
    right:2px;
    top:7px;
    width:5px;
    height:52px;
    border-radius:4px;
    background:#4b4c55;
  }
  .dropdown:before{
    content:"";
    position:absolute;
    right:3px;
    bottom:8px;
    width:0;
    height:0;
    border-left:4px solid transparent;
    border-right:4px solid transparent;
    border-top:5px solid #44464f;
  }
  .opt{
    position:absolute;
    left:14px;
    color:#e9edf5;
    font-size:15px;
    font-weight:500;
    line-height:22px;
  }
  .opt.one{top:8px}
  .opt.two{top:49px}
</style>
</head>
<body>
  <div class="page">
    <div class="header-title">灵感策划</div>
    <div class="top-right">
      <div class="hot">
        <svg viewBox="0 0 24 28" aria-hidden="true">
          <path d="M13.2 2.5c1.3 4.4 5.8 5.6 6.4 10.8.7 5.7-3.3 10.3-8.1 10.3-4.3 0-7.4-3.1-7.4-7.4 0-3.5 2-5.9 4.7-8.3-.3 2.4.6 4.1 2.1 5.3 2.7-2.1 3.5-5.6 2.3-10.7z" fill="none" stroke="#e60024" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M10.4 23.5c-2.1-.8-3.4-2.4-3.4-4.6 0-2 1.1-3.3 2.6-4.7.1 2.1 1.1 3.6 3.1 4.4 1.3-1.4 1.8-3.3 1.5-5.5 2.1 1.9 3 3.7 2.6 5.8-.5 3.1-3 4.7-6.4 4.6z" fill="#e60024" opacity=".82"/>
        </svg>
        <span>爆款榜单</span>
      </div>
      <div class="skip">跳过</div>
    </div>

    <div class="main">
      <div class="title">AI灵感策划</div>
      <div class="subtitle">基于您对剧本的初步设定策划多个故事题材方向</div>

      <div class="input-card">
        <div class="placeholder">选择下方的题材设定或输入您的想法，AI将自动生成三种剧本策划方案</div>

        <div class="toolbar">
          <div class="tool active">
            <svg viewBox="0 0 16 16">
              <circle cx="8" cy="4.2" r="2.1"></circle>
              <path d="M4.2 13c.4-2.5 1.7-4 3.8-4s3.4 1.5 3.8 4"></path>
            </svg>
            <span>目标受众</span>
            <svg class="chev" viewBox="0 0 10 10">
              <path d="M2 6.3 5 3.5l3 2.8"></path>
            </svg>
          </div>

          <div class="tool">
            <svg viewBox="0 0 16 16">
              <rect x="2" y="4" width="12" height="8" rx="1.2"></rect>
              <path d="M4.5 6.5h3M4.5 9.5h2M10 7l2 2-2 2"></path>
            </svg>
            <span>题材类型</span>
          </div>

          <div class="tool">
            <svg viewBox="0 0 16 16">
              <circle cx="8" cy="8" r="5.2"></circle>
              <path d="M8 2.2v2.2M8 11.6v2.2M2.2 8h2.2M11.6 8h2.2M8 6.2v3.5l2.4 1.1"></path>
            </svg>
            <span>核心设定</span>
          </div>

          <div class="tool">
            <svg viewBox="0 0 16 16">
              <circle cx="8" cy="8" r="5.5"></circle>
              <path d="M3 8h10M8 2.5c1.6 1.6 2.3 3.4 2.3 5.5S9.6 11.9 8 13.5M8 2.5C6.4 4.1 5.7 5.9 5.7 8s.7 3.9 2.3 5.5"></path>
            </svg>
            <span>风格元素</span>
          </div>
        </div>

        <div class="start-btn">
          <svg viewBox="0 0 18 18">
            <path d="M15.5 2.5 7.2 10.8"></path>
            <path d="M15.5 2.5 10.8 15.5 7.2 10.8 2.5 7.2 15.5 2.5z"></path>
          </svg>
          <span>开始策划</span>
          <span class="coin">50</span>
        </div>
      </div>

      <div class="dropdown">
        <div class="opt one">男频</div>
        <div class="opt two">女频</div>
      </div>
    </div>
  </div>
</body>
</html>

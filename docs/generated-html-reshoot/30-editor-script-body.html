<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=2050, height=968, initial-scale=1.0" />
<title>Editor</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:2050px;
    height:968px;
    overflow:hidden;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    color:#fff;
  }
  body{
    position:relative;
  }
  .app{
    width:2050px;
    height:968px;
    position:relative;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.055) 0px, rgba(255,255,255,.055) 1px, transparent 1px, transparent 5px),
      #010101;
  }
  .sidebar{
    position:absolute;
    left:0;
    top:0;
    width:86px;
    height:968px;
    background:#1b1c20;
    z-index:3;
  }
  .logo{
    position:absolute;
    left:31px;
    top:39px;
    width:25px;
    height:22px;
    color:#fff;
  }
  .logo svg{display:block;width:25px;height:22px}
  .nav{
    position:absolute;
    left:0;
    top:113px;
    width:86px;
  }
  .nav-item{
    width:86px;
    height:50px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#f4f4f6;
  }
  .nav-item svg{
    width:25px;
    height:25px;
    stroke:currentColor;
    stroke-width:2.3;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;
  }
  .nav-item.active .active-bg{
    width:47px;
    height:45px;
    border-radius:6px;
    background:#fff;
    position:absolute;
    left:20px;
    top:0;
  }
  .nav-item.active svg{
    color:#1d1e22;
    position:relative;
    z-index:1;
  }
  .sep{
    width:47px;
    height:1px;
    background:#47484d;
    margin:21px auto 19px auto;
  }
  .bottom{
    position:absolute;
    left:0;
    bottom:14px;
    width:86px;
  }
  .points{
    position:absolute;
    left:18px;
    bottom:78px;
    width:50px;
    height:22px;
    color:#e6e6ea;
    font-weight:800;
    font-size:20px;
    letter-spacing:-2px;
    line-height:22px;
    opacity:.95;
  }
  .points small{
    font-size:10px;
    letter-spacing:0;
    margin-left:1px;
    vertical-align:middle;
    opacity:.7;
  }
  .avatar{
    position:absolute;
    left:23px;
    bottom:20px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:
      radial-gradient(circle at 43% 38%, #e6a14e 0 4px, transparent 5px),
      radial-gradient(circle at 50% 38%, #1c1a18 0 13px, transparent 14px),
      linear-gradient(145deg,#513015,#121316 62%,#262b33);
    border:2px solid #f4a000;
    overflow:visible;
  }
  .avatar:after{
    content:"";
    position:absolute;
    right:-8px;
    bottom:0;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#ffb21b;
    border:2px solid #d88a00;
  }
  .title{
    position:absolute;
    left:112px;
    top:36px;
    height:32px;
    display:flex;
    align-items:center;
    gap:12px;
    color:#84858a;
    font-weight:800;
    font-size:26px;
    letter-spacing:.5px;
    z-index:2;
  }
  .spark{
    width:19px;
    height:19px;
    filter:drop-shadow(0 0 5px rgba(117,95,255,.65));
  }
  .tabs{
    position:absolute;
    left:556px;
    top:96px;
    height:39px;
    background:#1b1c20;
    border-radius:4px;
    display:flex;
    align-items:center;
    padding:4px 5px;
    gap:0;
    z-index:2;
  }
  .tab{
    height:31px;
    padding:0 17px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    font-weight:700;
    color:#fff;
    border-radius:4px;
    white-space:nowrap;
  }
  .tab.active{
    background:#fff;
    color:#17181c;
  }
  .export{
    position:absolute;
    left:1445px;
    top:96px;
    height:39px;
    width:134px;
    border-radius:4px;
    background:#1b1c20;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    color:#fff;
    font-size:14px;
    font-weight:800;
    z-index:2;
  }
  .export svg{
    width:17px;height:17px;
    stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;
  }
  .editor-card{
    position:absolute;
    left:555px;
    top:167px;
    width:441px;
    height:437px;
    background:#1b1c20;
    border-radius:13px;
    z-index:1;
  }
  .episode{
    position:absolute;
    left:16px;
    top:18px;
    font-weight:800;
    font-size:17px;
    color:#fff;
    line-height:22px;
  }
  .placeholder{
    position:absolute;
    left:16px;
    top:50px;
    color:#47484d;
    font-size:15px;
    font-weight:600;
  }
  .ruler{
    position:absolute;
    left:1525px;
    top:169px;
    width:55px;
    height:92px;
    z-index:2;
    color:#fff;
    font-weight:800;
  }
  .ruler .one{
    position:absolute;
    left:9px;
    top:-1px;
    font-size:15px;
  }
  .ruler .ten{
    position:absolute;
    left:0;
    bottom:-4px;
    font-size:15px;
  }
  .ticks{
    position:absolute;
    left:39px;
    top:6px;
    width:14px;
    height:84px;
  }
  .tick{
    position:absolute;
    right:0;
    height:1px;
    background:#d6d6d6;
    opacity:.86;
  }
  .tick:nth-child(1){top:0;width:13px}
  .tick:nth-child(2){top:9px;width:10px}
  .tick:nth-child(3){top:18px;width:13px}
  .tick:nth-child(4){top:27px;width:10px}
  .tick:nth-child(5){top:36px;width:13px}
  .tick:nth-child(6){top:45px;width:10px}
  .tick:nth-child(7){top:54px;width:13px}
  .tick:nth-child(8){top:63px;width:10px}
  .tick:nth-child(9){top:72px;width:13px}
  .tick:nth-child(10){top:81px;width:13px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <svg viewBox="0 0 48 40" aria-hidden="true">
        <path d="M40.8 1.5H13.4C6.5 1.5 2.5 5.2 2.5 10.7c0 5.4 3.7 8.6 10.3 8.6h17.1c2.3 0 3.3.8 3.3 2.3s-1.1 2.3-3.3 2.3H4.4v14.6h29.3c7.3 0 11.8-3.8 11.8-10.2 0-5.8-3.8-9.4-10.4-9.4H18.3c-2 0-3-.7-3-2.1s1-2.1 3-2.1h22.5V1.5Z" fill="#fff"/>
      </svg>
    </div>

    <nav class="nav">
      <div class="nav-item active">
        <div class="active-bg"></div>
        <svg viewBox="0 0 24 24"><path d="M8 4h8v4H8z"/><path d="M5 7H3.7A1.7 1.7 0 0 0 2 8.7v8.6A1.7 1.7 0 0 0 3.7 19H13"/><path d="M16 11h4v9h-8v-4h4z"/><path d="M6 11h5"/><path d="M6 15h5"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3 17.4 3.6a2.1 2.1 0 1 1 3 3l-2.7 2.7"/><path d="m4 20 7.8-7.8"/><path d="M8.5 4.5 19.5 15.5"/><path d="M6 3 3 6l4.5 4.5L3 15l6 6 4.5-4.5L18 21l3-3L10 7z"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h2v16H6a2 2 0 0 1-2-2Z"/><path d="M8 3h3l5 16h-3z"/><path d="M14 3h3l3 16h-3z"/></svg>
      </div>

      <div class="sep"></div>

      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6z"/><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M13.5 2.8c1.1 4-2.5 5.3-2.5 8 0 1.7 1.3 3 3 3 2.5 0 4-2.3 3.3-5.1 2.3 1.9 3.7 4.3 3.7 7 0 4-3.2 6.3-7 6.3s-7-2.3-7-6.3c0-3.2 1.8-5.8 4.6-7.8-.3 2.6 1 4 2.4 4"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="m12 21 9-12-4-5H7L3 9z"/><path d="M3 9h18"/><path d="m7 4 5 17 5-17"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H19v4H6.5A2.5 2.5 0 0 1 4 6.5v11A2.5 2.5 0 0 0 6.5 20H20v-8H6.5A2.5 2.5 0 0 1 4 9.5z"/><path d="M16 15h.01"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.3a2 2 0 1 1-4 0V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H2.7a2 2 0 1 1 0-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V2.7a2 2 0 1 1 4 0V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.3a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
      </div>
    </nav>

    <div class="points">1000<small>币</small></div>
    <div class="avatar"></div>
  </aside>

  <div class="title">
    <svg class="spark" viewBox="0 0 24 24">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7f73ff"/>
          <stop offset=".55" stop-color="#fff"/>
          <stop offset="1" stop-color="#6e52ff"/>
        </linearGradient>
      </defs>
      <path d="M12 1.8 14.3 9l7.2 2.3-7.2 2.4L12 21l-2.3-7.3-7.2-2.4L9.7 9z" fill="url(#g)" opacity=".85"/>
      <path d="M4.2 2.8 5 5.2l2.4.8L5 6.8 4.2 9.2 3.4 6.8 1 6l2.4-.8z" fill="#8577ff" opacity=".75"/>
    </svg>
    <span>剧本名称</span>
  </div>

  <div class="tabs">
    <div class="tab">故事梗概</div>
    <div class="tab">人物小传</div>
    <div class="tab">分集大纲</div>
    <div class="tab active">剧本正文</div>
  </div>

  <div class="export">
    <svg viewBox="0 0 24 24"><path d="M12 3v11"/><path d="m7 10 5 5 5-5"/><path d="M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"/></svg>
    <span>导出为Word</span>
  </div>

  <div class="editor-card">
    <div class="episode">第1集</div>
    <div class="placeholder">输入正文，或点击右侧AI生成</div>
  </div>

  <div class="ruler">
    <div class="one">1</div>
    <div class="ten">10</div>
    <div class="ticks">
      <div class="tick"></div><div class="tick"></div><div class="tick"></div><div class="tick"></div><div class="tick"></div>
      <div class="tick"></div><div class="tick"></div><div class="tick"></div><div class="tick"></div><div class="tick"></div>
    </div>
  </div>
</div>
</body>
</html>

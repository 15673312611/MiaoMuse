<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置 - 联系我们</title>
  <style>
    :root{
      --bg:#000;
      --panel:#1f2024;
      --sidebar:#1b1c20;
      --text:#f4f4f4;
      --muted:#cfcfcf;
      --accent:#fff;
    }
    html,body{
      width:2050px;
      height:968px;
      margin:0;
      overflow:hidden;
      background:
        repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 1px, rgba(0,0,0,0) 1px 8px),
        #000;
      font-family: Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color:var(--text);
    }
    .app{
      position:relative;
      width:2050px;
      height:968px;
      overflow:hidden;
    }
    .sidebar{
      position:absolute;
      left:0; top:0; bottom:0;
      width:93px;
      background:#1c1d21;
      border-right:1px solid rgba(255,255,255,0.04);
    }
    .logo{
      position:absolute;
      left:31px; top:34px;
      width:27px; height:22px;
      color:#fff;
      font-weight:800;
      font-size:44px;
      line-height:22px;
      letter-spacing:-2px;
      transform:scaleY(0.75);
    }
    .side-icons{
      position:absolute;
      left:0;
      top:88px;
      width:93px;
      height:760px;
    }
    .icon{
      width:93px;
      height:54px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      opacity:.95;
      font-size:29px;
      line-height:1;
    }
    .icon.smallgap{ margin-top:11px; }
    .divider{
      position:absolute;
      left:22px; top:284px;
      width:48px; height:1px;
      background:rgba(255,255,255,0.15);
    }
    .active{
      position:absolute;
      left:17px;
      top:557px;
      width:45px; height:45px;
      background:#fff;
      border-radius:7px;
      box-shadow:0 0 0 1px rgba(0,0,0,.15) inset;
    }
    .active .gear{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#111;
      font-size:27px;
    }
    .bottom-credit{
      position:absolute;
      left:15px; bottom:94px;
      font-size:20px;
      font-weight:700;
      color:#ededed;
      transform:scaleY(0.95);
      letter-spacing:0.5px;
    }
    .user{
      position:absolute;
      left:20px; bottom:19px;
      width:37px; height:37px;
      border-radius:50%;
      background: radial-gradient(circle at 38% 36%, #6b4b2a 0 16%, #2b1b0f 17% 34%, #0f0f0f 35% 100%);
      border:3px solid #f5b225;
      box-shadow:0 0 0 1px rgba(0,0,0,.4);
    }
    .user:after{
      content:"";
      position:absolute;
      right:-4px; bottom:0px;
      width:14px; height:14px;
      background:#f1b02f;
      border-radius:50%;
      box-shadow:0 0 0 1px rgba(255,255,255,.2) inset;
    }
    .main{
      position:absolute;
      left:93px; top:0; right:0; bottom:0;
      padding-left:25px;
    }
    .title{
      position:absolute;
      left:27px; top:33px;
      font-size:26px;
      font-weight:700;
      color:#fff;
      letter-spacing:0.5px;
    }
    .tabs{
      position:absolute;
      left:475px; top:95px;
      display:flex;
      background:#2a2a2d;
      border-radius:6px;
      overflow:hidden;
      height:38px;
      box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
    }
    .tab{
      padding:0 21px;
      display:flex;
      align-items:center;
      font-size:16px;
      color:#fff;
      line-height:38px;
      white-space:nowrap;
    }
    .tab.active{
      position:relative;
      left:auto; top:auto;
      width:auto; height:auto;
      border-radius:5px;
      margin:3px;
      background:#fff;
      color:#111;
      font-weight:700;
      box-shadow:none;
    }
    .card{
      position:absolute;
      left:472px; top:170px;
      width:559px; height:332px;
      background:#222326;
      border-radius:12px;
      box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
    }
    .qr-row{
      position:absolute;
      left:39px; top:40px;
      display:flex;
      gap:18px;
    }
    .qr{
      width:150px; height:150px;
      background:#fff;
      border-radius:6px;
      overflow:hidden;
      box-shadow:0 0 0 1px rgba(255,255,255,.02);
    }
    .qr svg{ width:100%; height:100%; display:block; }
    .labels{
      position:absolute;
      left:0; top:197px;
      width:100%;
      display:flex;
      justify-content:flex-start;
      gap:18px;
      color:#d7d7d7;
      font-size:18px;
    }
    .labels span{
      width:150px;
      text-align:center;
    }
    .desc{
      position:absolute;
      left:50px; top:249px;
      width:460px;
      text-align:center;
      color:#ffffff;
      font-size:16px;
      line-height:1.35;
      text-shadow:0 0 0 #fff;
    }
    .qr svg rect.bg{ fill:#fff; }
    .qr svg .dot{ fill:#111; }
    .qr svg .light{ fill:#fff; }
  </style>
</head>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2050, height=968, initial-scale=1.0">
<title>editor episode outline</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:2050px;height:968px;overflow:hidden;background:#030303;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#cfd2d8}
body{position:relative}
.app{width:2050px;height:968px;position:relative;background:#030303;overflow:hidden}
.sidebar{position:absolute;left:0;top:0;width:86px;height:968px;background:#08090a;border-right:1px solid rgba(255,255,255,.025)}
.logo{position:absolute;left:32px;top:38px;width:23px;height:22px;color:#686b70;font-size:34px;line-height:22px;font-weight:900;letter-spacing:-3px;opacity:.75}
.nav{position:absolute;left:0;top:113px;width:86px}
.nav-item{width:86px;height:49px;position:relative;margin-bottom:1px;color:#777b82;opacity:.62}
.nav-item.active .nav-bg{position:absolute;left:20px;top:0;width:47px;height:46px;background:#f2f2f2;border-radius:6px;opacity:.42}
.ico{position:absolute;left:32px;top:13px;width:22px;height:22px}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nav-sep{position:absolute;left:20px;top:284px;width:48px;height:1px;background:rgba(255,255,255,.08)}
.bottom-coin{position:absolute;left:18px;bottom:92px;color:#6f737a;font-size:20px;font-weight:700;opacity:.72}
.bottom-coin small{font-size:12px;margin-left:1px}
.avatar{position:absolute;left:23px;bottom:19px;width:42px;height:42px;border-radius:50%;border:2px solid rgba(184,111,9,.75);background:radial-gradient(circle at 50% 36%,#51361f 0 16%,#151515 17% 100%);box-shadow:0 0 0 1px rgba(0,0,0,.55) inset}
.avatar:after{content:"";position:absolute;right:-5px;bottom:2px;width:14px;height:14px;border-radius:4px;background:#8b6b1f;opacity:.75}
.main{position:absolute;left:86px;top:0;width:1964px;height:968px;background:
repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0px,rgba(255,255,255,.035) 1px,transparent 1px,transparent 6px),
#050505}
.main:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.72);pointer-events:none}
.title{position:absolute;left:27px;top:38px;font-size:26px;line-height:34px;font-weight:700;color:#646a73;letter-spacing:.5px;opacity:.55}
.title .star{font-size:17px;margin-right:10px;color:#8f6ff8}
.tabs{position:absolute;left:469px;top:95px;width:355px;height:40px;background:#111216;border-radius:4px;display:flex;align-items:center;padding:4px}
.tab{height:32px;padding:0 17px;border-radius:3px;color:#717882;font-size:14px;line-height:32px}
.tab.active{background:#d9dbe2;color:#202226}
.top-actions{position:absolute;left:1194px;top:95px;height:40px;display:flex;gap:12px;align-items:center}
.undo{width:96px;height:40px;border-radius:4px;background:#101114;display:flex;align-items:center;justify-content:center;gap:23px;color:#565b64}
.undo svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ai-btn{width:190px;height:40px;border-radius:4px;border:0;background:linear-gradient(135deg,#7952b9,#4f28db);color:#cfc7ff;font-size:14px;font-weight:700;letter-spacing:.2px;box-shadow:0 0 28px rgba(99,59,206,.18) inset;position:relative}
.ai-btn .spark{font-size:18px;margin-right:7px;color:#d6b9ff}
.ai-btn .coin{font-size:12px;margin-left:3px;opacity:.85}
.form{position:absolute;left:469px;top:167px;width:850px}
.label{font-size:14px;color:#69717d;font-weight:700;margin:0 0 20px 16px}
.label .req{color:#b10000;margin-left:4px}
.textarea{width:850px;height:192px;background:#07080a;border:1px solid rgba(255,255,255,.025);border-radius:8px;color:#3d444d;font-size:16px;padding:61px 16px 16px;line-height:24px}
.placeholder{color:#414850;opacity:.75}
.episode{position:absolute;left:469px;top:388px;width:850px}
.episode .label{margin-left:16px;margin-bottom:19px}
.input{width:850px;height:82px;border-radius:8px;background:#090a0d;border:1px solid rgba(255,255,255,.025);color:#555d68;font-size:16px;padding:18px 16px}
.sparkle-side{position:absolute;left:813px;top:2px;color:#8d70ff;font-size:19px;text-shadow:0 0 8px rgba(137,105,255,.4);opacity:.75}
.cards{position:absolute;left:1363px;top:168px;width:129px}
.card{position:relative;width:129px;height:129px;border-radius:9px;background:#07080a;border:1px solid rgba(255,255,255,.035);margin-bottom:10px;color:#353941}
.card.first{border:2px solid rgba(218,221,229,.32);box-shadow:0 0 0 1px rgba(0,0,0,.7) inset}
.card .dash{position:absolute;left:0;right:0;top:62px;text-align:center;font-size:18px;color:#3b4048}
.card .tag{position:absolute;right:0;top:17px;width:39px;height:37px;background:#101114;border-radius:15px 0 0 15px;color:#55575c;font-size:18px;font-weight:700;line-height:37px;text-align:center}
.card.first .tag{top:145px;display:none}
.tooltip{position:absolute;left:1252px;top:143px;width:240px;height:110px;background:#1b1c21;border-radius:12px;color:#fff;padding:17px 16px;box-shadow:0 18px 50px rgba(0,0,0,.38);z-index:5}
.tooltip:before{content:"";position:absolute;left:36px;top:-8px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:8px solid #1b1c21}
.tip-title{font-size:16px;font-weight:800;line-height:20px;margin-bottom:7px}
.tip-sub{font-size:14px;color:#8b929e;line-height:20px;white-space:nowrap}
.next{position:absolute;right:16px;bottom:13px;width:52px;height:22px;border-radius:4px;background:#282a30;color:#fff;font-size:12px;line-height:22px;text-align:center}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.18);pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">剧</div>
    <div class="nav">
      <div class="nav-item active">
        <div class="nav-bg"></div>
        <div class="ico">
          <svg viewBox="0 0 24 24"><path d="M8 4h7l3 3v13H8z"/><path d="M15 4v4h4"/><path d="M4 8h8"/><path d="M4 12h8"/><path d="M4 16h8"/></svg>
        </div>
      </div>
      <div class="nav-item">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M14.5 5.5l4 4"/><path d="M4 20l6-2 9-9-4-4-9 9z"/><path d="M5 5l4 4"/><path d="M9 5L5 9"/></svg></div>
      </div>
      <div class="nav-item">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M5 19V5h4l3 14z"/><path d="M12 5h3l4 14h-3z"/></svg></div>
      </div>
    </div>
    <div class="nav-sep"></div>
    <div class="nav" style="top:318px">
      <div class="nav-item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M12 21s8-4 8-10V5l-8-3-8 3v6c0 6 8 10 8 10z"/><path d="M12 8v4l3 2"/></svg></div></div>
      <div class="nav-item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3s2 4 2 7a4 4 0 1 1-8 0c0-1.5.8-3.3 2-5 0 0 0 5 4 5 2 0 2-2 0-7z"/></svg></div></div>
      <div class="nav-item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M3 8l4-5h10l4 5-9 13z"/><path d="M3 8h18"/><path d="M8 8l4 13 4-13"/><path d="M7 3l1 5"/><path d="M17 3l-1 5"/></svg></div></div>
      <div class="nav-item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M4 7h14a2 2 0 0 1 2 2v10H6a2 2 0 0 1-2-2z"/><path d="M4 7V5h13"/><path d="M16 13h5v4h-5z"/></svg></div></div>
      <div class="nav-item"><div class="ico"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div></div>
      <div class="nav-item"><div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.18.39.39.72.6 1 .31.33.7.52 1.1.6H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/></svg></div></div>
    </div>
    <div class="bottom-coin">1000<small>∞</small></div>
    <div class="avatar"></div>
  </aside>

  <main class="main">
    <div class="title"><span class="star">✦</span>剧本名称</div>

    <div class="tabs">
      <div class="tab">故事梗概</div>
      <div class="tab">人物小传</div>
      <div class="tab active">分集大纲</div>
      <div class="tab">剧本正文</div>
    </div>

    <div class="top-actions">
      <div class="undo">
        <svg viewBox="0 0 24 24"><path d="M9 14l-4-4 4-4"/><path d="M5 10h9a5 5 0 1 1-3.5 8.5"/></svg>
        <svg viewBox="0 0 24 24"><path d="M15 14l4-4-4-4"/><path d="M19 10h-9a5 5 0 1 0 3.5 8.5"/></svg>
      </div>
      <button class="ai-btn"><span class="spark">✦</span>AI生成全部粗纲 80<span class="coin">∞</span></button>
    </div>

    <section class="form">
      <div class="label">粗纲 <span class="req">*</span></div>
      <div class="textarea"><span class="placeholder">请输入内容，3000字以内</span></div>
    </section>

    <section class="episode">
      <div class="label">集纲 <span class="req">*</span></div>
      <div class="sparkle-side">✣</div>
      <div class="input">第1集</div>
    </section>

    <div class="cards">
      <div class="card first"><div class="dash">-</div></div>
      <div class="card"><div class="tag">承</div><div class="dash">-</div></div>
      <div class="card"><div class="tag">转</div><div class="dash">-</div></div>
      <div class="card"><div class="tag">合</div><div class="dash">-</div></div>
    </div>

    <div class="tooltip">
      <div class="tip-title">点击AI，一键生成全部粗纲</div>
      <div class="tip-sub">根据梗概&人物一键生成所有粗纲</div>
      <div class="next">下一步</div>
    </div>
  </main>
</div>
</body>
</html>

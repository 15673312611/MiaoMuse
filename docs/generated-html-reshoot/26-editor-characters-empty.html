<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=2050, initial-scale=1.0" />
<title>复刻页面</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:2050px;
    height:968px;
    overflow:hidden;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    color:#fff;
  }
  .page{
    position:relative;
    width:2050px;
    height:968px;
    background:#000;
  }
  .sidebar{
    position:absolute;
    left:0;
    top:0;
    width:86px;
    height:968px;
    background:#191a1f;
  }
  .main{
    position:absolute;
    left:86px;
    top:0;
    width:1964px;
    height:968px;
    overflow:hidden;
    border-top-left-radius:19px;
    border-bottom-left-radius:19px;
    background:
      repeating-linear-gradient(132deg,
        rgba(255,255,255,.035) 0px,
        rgba(255,255,255,.035) 1px,
        transparent 1px,
        transparent 6px),
      #020202;
  }
  .logo{
    position:absolute;
    left:31px;
    top:39px;
    width:28px;
    height:23px;
  }
  .logo:before,.logo:after{
    content:"";
    position:absolute;
    background:#fff;
    border-radius:10px;
  }
  .logo:before{
    width:28px;
    height:6px;
    top:0;
    left:0;
    box-shadow:0 17px 0 #fff;
  }
  .logo:after{
    width:17px;
    height:6px;
    top:8px;
    left:0;
    transform:skewX(-18deg);
  }
  .nav{
    position:absolute;
    left:0;
    top:113px;
    width:86px;
  }
  .nav-item{
    width:86px;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#f5f5f7;
  }
  .nav-item.active .box{
    width:47px;
    height:45px;
    border-radius:6px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#191a1f;
  }
  .nav svg{width:23px;height:23px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .divider{
    position:absolute;
    left:20px;
    top:284px;
    width:47px;
    height:1px;
    background:#4b4c50;
  }
  .nav2{
    position:absolute;
    left:0;
    top:315px;
    width:86px;
  }
  .nav2 .nav-item{height:50px;color:#f1f1f4}
  .points{
    position:absolute;
    left:17px;
    bottom:94px;
    color:#d9d9df;
    font-size:20px;
    font-weight:700;
    letter-spacing:-1px;
    text-shadow:0 0 1px #fff;
  }
  .points small{
    font-size:10px;
    margin-left:2px;
    vertical-align:1px;
    opacity:.8;
  }
  .avatar{
    position:absolute;
    left:23px;
    bottom:20px;
    width:43px;
    height:43px;
    border-radius:50%;
    border:2px solid #f4a11a;
    background:
      radial-gradient(circle at 48% 34%, #d99550 0 10px, transparent 11px),
      radial-gradient(circle at 50% 55%, #111 0 20px, transparent 21px),
      linear-gradient(135deg,#1d2128,#342211);
    overflow:visible;
  }
  .avatar:after{
    content:"";
    position:absolute;
    right:-6px;
    bottom:0;
    width:15px;
    height:15px;
    border-radius:50%;
    background:#f6b41d;
    border:2px solid #d99100;
  }
  .title{
    position:absolute;
    left:112px;
    top:36px;
    height:31px;
    display:flex;
    align-items:center;
    gap:10px;
    color:#8a8b91;
    font-size:28px;
    font-weight:700;
  }
  .spark{
    width:20px;height:20px;position:relative;opacity:.85;
  }
  .spark:before{
    content:"✦";
    position:absolute;
    left:0;top:-3px;
    color:#865cff;
    font-size:21px;
    text-shadow:0 0 8px rgba(134,92,255,.8);
  }
  .tabs{
    position:absolute;
    left:555px;
    top:95px;
    width:354px;
    height:39px;
    background:#18191d;
    border-radius:4px;
    display:flex;
    align-items:center;
    padding:4px;
  }
  .tab{
    height:31px;
    padding:0 19px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:15px;
    font-weight:600;
    border-radius:3px;
    white-space:nowrap;
  }
  .tab.active{
    background:#fff;
    color:#17181b;
  }
  .top-actions{
    position:absolute;
    left:1378px;
    top:95px;
    height:39px;
    display:flex;
    gap:22px;
  }
  .undo{
    width:47px;
    height:39px;
    border-radius:3px;
    background:rgba(25,26,30,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#6e7077;
  }
  .undo svg{width:19px;height:19px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ai-btn{
    width:135px;
    height:39px;
    border-radius:4px;
    background:linear-gradient(90deg,#4a2d6f,#4020a8);
    color:rgba(255,255,255,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:15px;
    font-weight:700;
  }
  .ai-btn .ai-spark{font-size:18px;color:rgba(255,255,255,.35)}
  .card{
    position:absolute;
    left:555px;
    top:167px;
    width:576px;
    height:751px;
    background:#18191d;
    border-radius:8px;
  }
  .add-card{
    position:absolute;
    left:1160px;
    top:167px;
    width:130px;
    height:129px;
    background:#18191d;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aeb4c0;
  }
  .add-card svg{width:38px;height:38px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .empty{
    position:absolute;
    left:0;
    top:0;
    width:576px;
    height:751px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .empty-icon{
    margin-top:287px;
    color:#c7cedb;
  }
  .empty-icon svg{width:58px;height:58px;stroke:currentColor;stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .empty-text{
    margin-top:17px;
    color:#fff;
    font-size:16px;
    line-height:26px;
    font-weight:600;
    text-align:center;
  }
  .gen{
    margin-top:17px;
    width:120px;
    height:39px;
    border:0;
    border-radius:5px;
    background:#fff;
    color:#1b1c20;
    font-size:14px;
    font-weight:600;
    font-family:inherit;
  }
</style>
</head>
<body>
<div class="page">
  <aside class="sidebar">
    <div class="logo"></div>

    <div class="nav">
      <div class="nav-item active">
        <div class="box">
          <svg viewBox="0 0 24 24"><path d="M8 4h8v4H8z"/><path d="M6 8h10a2 2 0 0 1 2 2v10H8a2 2 0 0 1-2-2z"/><path d="M10 12h5M10 16h5"/><path d="M4 6v10"/></svg>
        </div>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3l3-3a2.1 2.1 0 0 1 3 3l-3 3"/><path d="M11 9l4 4"/><path d="M4 20l7.5-7.5"/><path d="M3 12l6 6"/><path d="M4.5 4.5l4 4"/><path d="M8 3l2 2-5 5-2-2z"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h2v16H6a2 2 0 0 1-2-2z"/><path d="M10 3h2l5 16h-4z"/><path d="M15 3h2l5 16h-3"/></svg>
      </div>
    </div>

    <div class="divider"></div>

    <div class="nav2">
      <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v6c0 5-4 8-8 10-4-2-8-5-8-10V7z"/><path d="M12 8a4 4 0 1 0 4 4"/><path d="M16 8v4h4"/></svg></div>
      <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 3s-1 5-4 8a5 5 0 1 0 9 3c0-3-3-5-3-8 3 2 5 5 5 9a7 7 0 1 1-14 0c0-3 2-5 4-7"/></svg></div>
      <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M3 8l4-5h10l4 5-9 13z"/><path d="M3 8h18"/><path d="M7 3l5 18 5-18"/></svg></div>
      <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 7h15a2 2 0 0 1 2 2v10H5a2 2 0 0 1-2-2V8a1 1 0 0 1 1-1z"/><path d="M5 7V5a2 2 0 0 1 2-2h10"/><path d="M17 13h4v4h-4a2 2 0 0 1 0-4z"/></svg></div>
      <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg></div>
      <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4.2 17l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.3 7A2 2 0 1 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3h.1A1.7 1.7 0 0 0 10 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1A1.7 1.7 0 0 0 21 10h.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1z"/></svg></div>
    </div>

    <div class="points">1000<small>∞</small></div>
    <div class="avatar"></div>
  </aside>

  <main class="main">
    <div class="title"><span class="spark"></span><span>剧本名称</span></div>

    <div class="tabs">
      <div class="tab">故事梗概</div>
      <div class="tab active">人物小传</div>
      <div class="tab">分集大纲</div>
      <div class="tab">剧本正文</div>
    </div>

    <div class="top-actions">
      <div class="undo">
        <svg viewBox="0 0 24 24"><path d="M9 7H5V3"/><path d="M5 7a8 8 0 1 1-1 8"/></svg>
      </div>
      <div class="ai-btn"><span class="ai-spark">✧</span><span>AI生成 50∞</span></div>
    </div>

    <section class="card">
      <div class="empty">
        <div class="empty-icon">
          <svg viewBox="0 0 64 64">
            <rect x="9" y="6" width="46" height="54" rx="5"></rect>
            <circle cx="32" cy="25" r="9"></circle>
            <path d="M18 55v-6a7 7 0 0 1 7-7h14a7 7 0 0 1 7 7v6"></path>
          </svg>
        </div>
        <div class="empty-text">点击右侧按钮创建新角色，自定义角色信息<br/>或由AI一键生成所有角色</div>
        <button class="gen">一键生成 50∞</button>
      </div>
    </section>

    <section class="add-card">
      <svg viewBox="0 0 48 48">
        <circle cx="20" cy="16" r="7"></circle>
        <path d="M8 38v-5a9 9 0 0 1 9-9h6a9 9 0 0 1 5 1.6"></path>
        <path d="M35 16v12"></path>
        <path d="M29 22h12"></path>
      </svg>
    </section>
  </main>
</div>
</body>
</html>

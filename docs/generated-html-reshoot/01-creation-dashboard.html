<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2050, height=968, initial-scale=1.0">
<title>剧本原创</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:2050px;
    height:968px;
    overflow:hidden;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
    color:#fff;
  }
  .page{
    position:relative;
    width:2050px;
    height:968px;
    background:#000;
    overflow:hidden;
  }
  .sidebar{
    position:absolute;
    left:0;
    top:0;
    width:108px;
    height:968px;
    background:#1b1c20;
    z-index:5;
  }
  .logo{
    position:absolute;
    left:40px;
    top:42px;
    width:29px;
    height:19px;
  }
  .logo:before,.logo:after{
    content:"";
    position:absolute;
    left:0;
    width:29px;
    height:5px;
    background:#f4f5f7;
    border-radius:4px;
  }
  .logo:before{top:0}
  .logo:after{bottom:0}
  .logo span{
    position:absolute;
    right:0;
    top:7px;
    width:20px;
    height:5px;
    background:#f4f5f7;
    border-radius:4px;
  }
  .nav{
    position:absolute;
    top:113px;
    left:0;
    width:108px;
  }
  .nav-item{
    position:relative;
    width:108px;
    height:63px;
  }
  .nav-item.active .active-bg{
    position:absolute;
    left:25px;
    top:0;
    width:58px;
    height:58px;
    border-radius:7px;
    background:#fff;
  }
  .nav-item svg{
    position:absolute;
    left:41px;
    top:16px;
    width:27px;
    height:27px;
    stroke:#fff;
    fill:none;
    stroke-width:2.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .nav-item.active svg{stroke:#111;z-index:2}
  .divider{
    position:absolute;
    left:25px;
    top:285px;
    width:58px;
    height:1px;
    background:#56575b;
  }
  .nav.lower{top:318px}
  .nav.lower .nav-item{height:62px}
  .points{
    position:absolute;
    left:22px;
    bottom:77px;
    height:24px;
    color:#e7e8eb;
    font-size:20px;
    font-weight:800;
    letter-spacing:-2px;
    opacity:.92;
  }
  .points small{
    font-size:11px;
    letter-spacing:0;
    margin-left:1px;
    opacity:.8;
  }
  .avatar{
    position:absolute;
    left:29px;
    bottom:16px;
    width:49px;
    height:49px;
    border-radius:50%;
    border:3px solid #ffac17;
    background:
      radial-gradient(circle at 48% 32%, #b88758 0 7px, transparent 8px),
      radial-gradient(circle at 55% 56%, #5c3426 0 16px, transparent 17px),
      linear-gradient(135deg,#101219,#3c2818 55%,#0c0d12);
    box-shadow:0 0 0 1px rgba(0,0,0,.6) inset;
  }
  .badge{
    position:absolute;
    left:66px;
    bottom:13px;
    width:19px;
    height:19px;
    background:linear-gradient(135deg,#ffd23c,#ff9e0d);
    clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
    border:1px solid rgba(255,255,255,.55);
  }
  .main{
    position:absolute;
    left:108px;
    top:0;
    width:1942px;
    height:968px;
    border-top-left-radius:28px;
    border-bottom-left-radius:28px;
    background-color:#000;
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,.055) 0px, rgba(255,255,255,.055) 1px, transparent 1px, transparent 6px);
    overflow:hidden;
  }
  .title{
    position:absolute;
    left:29px;
    top:38px;
    font-size:28px;
    line-height:38px;
    font-weight:800;
    letter-spacing:.5px;
    color:#fff;
  }
  .search{
    position:absolute;
    left:710px;
    top:38px;
    width:500px;
    height:40px;
    border:1px solid #34363c;
    background:#18191d;
    border-radius:5px;
    box-shadow:0 0 0 1px rgba(255,255,255,.02) inset;
  }
  .search span{
    position:absolute;
    left:14px;
    top:9px;
    font-size:16px;
    line-height:20px;
    color:#8d929c;
    font-weight:400;
  }
  .search .sicon{
    position:absolute;
    right:8px;
    top:8px;
    width:26px;
    height:26px;
    border:1px solid #5d6068;
    border-radius:5px;
  }
  .search .sicon:before{
    content:"";
    position:absolute;
    left:6px;
    top:5px;
    width:10px;
    height:10px;
    border:1.7px solid #9ca0a9;
    border-radius:50%;
  }
  .search .sicon:after{
    content:"";
    position:absolute;
    left:16px;
    top:16px;
    width:8px;
    height:2px;
    background:#9ca0a9;
    border-radius:2px;
    transform:rotate(45deg);
    transform-origin:left center;
  }
  .tutorial{
    position:absolute;
    right:171px;
    top:46px;
    font-size:14px;
    line-height:20px;
    color:#fff;
    font-weight:700;
  }
  .new-btn{
    position:absolute;
    right:34px;
    top:29px;
    width:112px;
    height:42px;
    border-radius:4px;
    background:#202126;
    color:#fff;
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .new-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .sort{
    position:absolute;
    left:580px;
    top:84px;
    width:100px;
    height:30px;
    color:#fff;
    font-size:16px;
    font-weight:700;
    line-height:30px;
  }
  .sort svg{
    width:16px;
    height:16px;
    stroke:#d7d8dc;
    stroke-width:2;
    vertical-align:-2px;
    margin-right:5px;
  }
  .list{
    position:absolute;
    left:572px;
    top:140px;
    width:400px;
  }
  .item{
    position:relative;
    width:400px;
    height:122px;
    margin-bottom:31px;
  }
  .thumb{
    position:absolute;
    left:0;
    top:0;
    width:120px;
    height:90px;
    border-radius:10px;
    overflow:hidden;
    background:
      radial-gradient(circle at 74% 8%, rgba(255,91,160,.95) 0, rgba(255,99,164,.72) 25%, transparent 45%),
      radial-gradient(circle at 18% 84%, rgba(255,217,217,.85) 0, rgba(250,178,190,.78) 34%, transparent 58%),
      linear-gradient(135deg,#8b58e8 0%,#f795b5 48%,#8fc6ef 100%);
  }
  .thumb:before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(110deg,rgba(255,255,255,.35),rgba(255,255,255,0) 38%),
      repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px);
    opacity:.7;
  }
  .thumb .ai{
    position:absolute;
    left:0;
    top:0;
    width:48px;
    height:38px;
    border-bottom-right-radius:10px;
    background:#6041bf;
    color:#ece8ff;
    font-size:14px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  .frame-lines{
    position:absolute;
    left:36px;
    top:18px;
    width:70px;
    height:55px;
    opacity:.34;
    z-index:1;
  }
  .frame-lines div{
    position:absolute;
    border:1px solid #fff;
  }
  .frame-lines div:nth-child(1){left:0;top:0;width:58px;height:49px}
  .frame-lines div:nth-child(2){left:8px;top:8px;width:58px;height:49px}
  .frame-lines div:nth-child(3){left:18px;top:16px;width:44px;height:36px}
  .item-title{
    position:absolute;
    left:142px;
    top:13px;
    font-size:20px;
    line-height:28px;
    font-weight:800;
    color:#fff;
  }
  .item-time{
    position:absolute;
    left:142px;
    top:49px;
    font-size:14px;
    line-height:20px;
    color:#9aa0aa;
    font-weight:500;
    white-space:nowrap;
  }
  .bot{
    position:absolute;
    right:38px;
    bottom:213px;
    width:58px;
    height:52px;
    filter:drop-shadow(0 0 12px rgba(126,73,255,.75));
  }
  .bot .antenna{
    position:absolute;
    left:28px;
    top:-12px;
    width:2px;
    height:16px;
    background:#9c72ff;
  }
  .bot .dot{
    position:absolute;
    left:23px;
    top:-18px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#b58aff;
  }
  .bot .head{
    position:absolute;
    left:4px;
    top:12px;
    width:50px;
    height:34px;
    border-radius:18px;
    background:linear-gradient(180deg,#7a4dff,#5127d4);
    box-shadow:0 0 0 3px rgba(150,108,255,.34), inset 0 -5px 10px rgba(0,0,0,.25);
  }
  .bot .face{
    position:absolute;
    left:12px;
    top:19px;
    width:34px;
    height:17px;
    border-radius:7px;
    background:#fff;
  }
  .bot .eye{
    position:absolute;
    top:24px;
    width:5px;
    height:6px;
    border-radius:3px;
    background:#6a46ea;
  }
  .bot .eye.l{left:21px}
  .bot .eye.r{right:21px}
  .bot .ear{
    position:absolute;
    top:21px;
    width:7px;
    height:17px;
    border-radius:5px;
    background:#6b3df0;
  }
  .bot .ear.l{left:0}
  .bot .ear.r{right:0}
</style>
</head>
<body>
<div class="page">
  <aside class="sidebar">
    <div class="logo"><span></span></div>

    <div class="nav">
      <div class="nav-item active">
        <div class="active-bg"></div>
        <svg viewBox="0 0 24 24"><path d="M8 4h10v14H8z"/><path d="M5 7h3v13h11"/><path d="M11 8h4M11 12h4"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 14l10-10 3 3L7 17H4z"/><path d="M14 4l6 6"/><path d="M13 13l7 7"/><path d="M20 14l-6 6"/><path d="M4 4l6 6"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M5 19V5h4l6 14h-4L5 5"/><path d="M15 5l4 14"/></svg>
      </div>
    </div>

    <div class="divider"></div>

    <div class="nav lower">
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 3l8 4v6c0 5-4 8-8 9-4-1-8-4-8-9V7z"/><path d="M15.5 10.5A3.5 3.5 0 1 0 12 14h4v-4"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 3c2 4-3 5-3 9a4 4 0 0 0 8 0c0-3-2-5-4-8 6 3 8 14 0 17-6 2-11-4-7-10"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 8h18l-4 12H7z"/><path d="M8 8l4 12 4-12"/><path d="M6 8l4-5h4l4 5"/><path d="M10 3l-2 5M14 3l2 5"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M4 6h15a2 2 0 0 1 2 2v12H4z"/><path d="M4 6a2 2 0 0 1 2-2h12"/><path d="M16 14h5"/><circle cx="18.5" cy="14" r="1.5"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a6 6 0 0 1 12 0v2"/><path d="M16 5a4 4 0 0 1 0 8"/><path d="M18 17a5 5 0 0 1 3 5"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 0 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.3 7A2 2 0 0 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 0 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1a2 2 0 0 1 0 4H21a1.7 1.7 0 0 0-1.6 1z"/></svg>
      </div>
    </div>

    <div class="points">1000<small>⌘</small></div>
    <div class="avatar"></div>
    <div class="badge"></div>
  </aside>

  <main class="main">
    <div class="title">剧本原创</div>

    <div class="search">
      <span>根据名称、核心梗概进行搜索</span>
      <div class="sicon"></div>
    </div>

    <div class="tutorial">使用教程</div>
    <div class="new-btn">
      <svg viewBox="0 0 24 24"><path d="M8 4h10v14H8z"/><path d="M5 7h3v13h11"/></svg>
      新建剧本
    </div>

    <div class="sort">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h12M4 17h8"/></svg>排序方式
    </div>

    <div class="list">
      <div class="item">
        <div class="thumb">
          <div class="ai">AI</div>
          <div class="frame-lines"><div></div><div></div><div></div></div>
        </div>
        <div class="item-title">未命名</div>
        <div class="item-time">上次修改于 06月05日 20:52</div>
      </div>

      <div class="item">
        <div class="thumb">
          <div class="ai">AI</div>
          <div class="frame-lines"><div></div><div></div><div></div></div>
        </div>
        <div class="item-title">未命名</div>
        <div class="item-time">上次修改于 06月05日 19:48</div>
      </div>
    </div>

    <div class="bot">
      <div class="antenna"></div>
      <div class="dot"></div>
      <div class="ear l"></div>
      <div class="ear r"></div>
      <div class="head"></div>
      <div class="face"></div>
      <div class="eye l"></div>
      <div class="eye r"></div>
    </div>
  </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2050, height=968, initial-scale=1.0">
<title>设置</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:2050px;
  height:968px;
  overflow:hidden;
  background:#050505;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  color:#d8d8d8;
}
.page{
  position:relative;
  width:2050px;
  height:968px;
  background:#050505;
}
.sidebar{
  position:absolute;
  left:0;top:0;
  width:86px;height:968px;
  background:#050505;
  border-right:1px solid rgba(255,255,255,.018);
}
.logo{
  position:absolute;
  left:31px;top:38px;
  width:25px;height:21px;
  color:#5f6062;
  font-size:32px;
  font-weight:800;
  line-height:18px;
  transform:skewX(-12deg);
  opacity:.72;
}
.nav{
  position:absolute;
  left:0;top:123px;
  width:86px;
}
.nav-item{
  position:relative;
  width:86px;height:50px;
  margin-bottom:1px;
}
.nav-item svg{
  position:absolute;
  left:33px;top:14px;
  width:22px;height:22px;
  stroke:#56585c;
  stroke-width:2.2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:.72;
}
.nav .sep{
  width:47px;height:1px;
  margin:12px 0 18px 20px;
  background:rgba(255,255,255,.08);
}
.nav-item.active{
  margin-left:20px;
  margin-top:8px;
  width:46px;height:46px;
  border-radius:6px;
  background:#5b5b5d;
}
.nav-item.active svg{
  left:12px;top:12px;
  width:23px;height:23px;
  stroke:#050505;
  opacity:1;
}
.bottom{
  position:absolute;
  left:0;bottom:20px;
  width:86px;height:100px;
}
.coins{
  position:absolute;
  left:18px;top:3px;
  font-size:18px;
  font-weight:700;
  color:#6b6c70;
  opacity:.75;
}
.coin-dot{
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  border:1px solid #777;
  margin-left:2px;
  vertical-align:6px;
}
.avatar{
  position:absolute;
  left:23px;top:53px;
  width:40px;height:40px;
  border-radius:50%;
  background:
    radial-gradient(circle at 52% 42%, #392b1b 0 25%, transparent 26%),
    radial-gradient(circle at 48% 52%, #8a6335 0 17%, transparent 18%),
    linear-gradient(135deg,#141414,#28201a 45%,#0d0d0d);
  border:2px solid #6b4a12;
  box-shadow:0 0 0 1px rgba(0,0,0,.8) inset;
}
.avatar:after{
  content:"";
  position:absolute;
  right:-6px;bottom:0;
  width:13px;height:13px;
  border-radius:50%;
  background:#7a5d22;
}
.main{
  position:absolute;
  left:86px;top:0;
  width:1964px;height:968px;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0px,rgba(255,255,255,.018) 1px,transparent 1px,transparent 6px),
    #080808;
}
.title{
  position:absolute;
  left:24px;top:35px;
  font-size:26px;
  line-height:28px;
  font-weight:800;
  color:#3f4145;
  letter-spacing:.5px;
}
.tabs{
  position:absolute;
  left:470px;top:99px;
  width:354px;height:36px;
  background:#101114;
  border-radius:4px;
  display:flex;
  align-items:center;
  padding:0 7px;
  gap:7px;
}
.tab{
  height:30px;
  min-width:75px;
  padding:0 14px;
  border-radius:3px;
  color:#363943;
  font-size:14px;
  line-height:30px;
  text-align:center;
}
.tab.active{
  background:#696a6c;
  color:#0d0e10;
}
.settings-form{
  position:absolute;
  left:470px;top:170px;
  width:395px;
  color:#343741;
}
.row{
  position:relative;
  width:395px;
  margin-bottom:31px;
}
.label{
  font-size:15px;
  line-height:22px;
  color:#363943;
  margin-bottom:9px;
}
.value{
  height:28px;
  line-height:28px;
  border-bottom:1px solid rgba(255,255,255,.035);
  color:#404249;
  font-size:15px;
  font-weight:700;
  padding-left:16px;
}
.hint{
  margin-top:8px;
  font-size:15px;
  color:#262a34;
}
.logout{
  position:absolute;
  left:0;top:237px;
  width:89px;height:40px;
  border-radius:6px;
  background:#666;
  color:#090909;
  border:0;
  font-size:14px;
}
.dim{
  position:absolute;
  left:0;top:0;
  width:2050px;height:968px;
  background:rgba(0,0,0,.69);
}
.modal{
  position:absolute;
  left:839px;top:213px;
  width:370px;height:542px;
  background:#1e1f23;
  border-radius:5px;
  box-shadow:0 14px 30px rgba(0,0,0,.35);
  padding:27px 26px 0 25px;
  color:#e6e6e8;
}
.modal h2{
  margin:0 0 10px 0;
  font-size:20px;
  line-height:24px;
  font-weight:800;
  color:#f2f2f3;
}
.desc{
  width:310px;
  color:#70798b;
  font-size:14px;
  line-height:20px;
  margin-bottom:20px;
  font-weight:500;
}
.mlabel{
  font-size:14px;
  line-height:20px;
  color:#747d90;
  margin-bottom:7px;
}
.input{
  position:relative;
  width:319px;height:45px;
  background:#000;
  border:1px solid #2b2d34;
  border-radius:4px;
  margin-bottom:20px;
  color:#e8e8ea;
}
.phone{
  display:flex;
  align-items:center;
  padding-left:17px;
  font-size:15px;
}
.prefix{
  display:inline-block;
  padding-right:17px;
  border-right:1px solid #aeb0b7;
  height:24px;
  line-height:24px;
}
.caret{
  display:inline-block;
  width:1px;height:23px;
  background:#e8e8e8;
  margin-left:17px;
}
.verify-row{
  display:flex;
  gap:15px;
  margin-bottom:20px;
}
.verify-row .input{
  width:166px;
  margin:0;
}
.code-btn{
  width:139px;height:45px;
  border-radius:5px;
  border:1px solid #d5d5d8;
  background:transparent;
  color:#f0f0f2;
  font-size:15px;
  font-weight:700;
}
.pass{
  margin-bottom:20px;
}
.eye{
  position:absolute;
  right:12px;top:15px;
  width:18px;height:15px;
}
.eye svg{
  width:18px;height:15px;
  stroke:#b8bdc8;
  fill:none;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.actions{
  position:absolute;
  right:26px;bottom:27px;
  display:flex;
  align-items:center;
  gap:22px;
}
.cancel{
  color:#fff;
  font-size:15px;
}
.confirm{
  width:60px;height:40px;
  border:0;
  border-radius:5px;
  background:#fff;
  color:#1b1c20;
  font-size:15px;
  font-weight:700;
}
</style>
</head>
<body>
<div class="page">
  <aside class="sidebar">
    <div class="logo">S</div>
    <div class="nav">
      <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M8 6h10v12H8z"/><path d="M5 3h10v3"/><path d="M5 3v12h3"/></svg></div>
      <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M14 7l3-3 3 3-3 3z"/><path d="M4 20l6-6"/><path d="M7 9l8 8"/><path d="M4 5l4 4"/><path d="M5 12l7-7"/></svg></div>
      <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M5 20V5h4l4 15"/><path d="M11 5h4l4 15"/></svg></div>
      <div class="sep"></div>
      <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4l3 2"/></svg></div>
      <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M13 2s1 4-2 7c-2 2-3 4-2 7 1.1 3.2 5 4.5 8 2.5 3-2 3.5-6.8.5-10.5"/></svg></div>
      <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2l9 7-4 11H7L3 9z"/><path d="M3 9h18"/><path d="M8 9l4 11 4-11"/><path d="M8 9l4-7 4 7"/></svg></div>
      <div class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="17" height="13" rx="2"/><path d="M16 10h5v5h-5a2.5 2.5 0 010-5z"/><path d="M7 6V4h10"/></svg></div>
      <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 10-8 0"/><path d="M3 20a6 6 0 0112 0"/><path d="M18 8a3 3 0 11.5 6"/><path d="M19 20a5 5 0 00-3-4.5"/></svg></div>
      <div class="nav-item active"><svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z"/><path d="M19.4 15a1.8 1.8 0 00.36 1.98l.05.05a2.1 2.1 0 01-2.97 2.97l-.05-.05A1.8 1.8 0 0014.8 19.6a1.8 1.8 0 00-1.1 1.65V21a2.1 2.1 0 01-4.2 0v-.08a1.8 1.8 0 00-1.18-1.66 1.8 1.8 0 00-1.98.36l-.05.05a2.1 2.1 0 01-2.97-2.97l.05-.05A1.8 1.8 0 003.7 14.7 1.8 1.8 0 002.05 13H2a2.1 2.1 0 010-4.2h.08A1.8 1.8 0 003.74 7.6a1.8 1.8 0 00-.36-1.98l-.05-.05A2.1 2.1 0 016.3 2.6l.05.05A1.8 1.8 0 008.3 3a1.8 1.8 0 001.1-1.65V1.3a2.1 2.1 0 014.2 0v.08A1.8 1.8 0 0014.8 3a1.8 1.8 0 001.98-.36l.05-.05a2.1 2.1 0 012.97 2.97l-.05.05A1.8 1.8 0 0019.4 7.6a1.8 1.8 0 001.65 1.1h.08a2.1 2.1 0 010 4.2h-.08A1.8 1.8 0 0019.4 15z"/></svg></div>
    </div>
    <div class="bottom">
      <div class="coins">1000<span class="coin-dot"></span></div>
      <div class="avatar"></div>
    </div>
  </aside>

  <main class="main">
    <div class="title">设置</div>
    <div class="tabs">
      <div class="tab">我的资料</div>
      <div class="tab active">账号安全</div>
      <div class="tab">联系我们</div>
      <div class="tab">通用设置</div>
    </div>
    <div class="settings-form">
      <div class="row">
        <div class="label">手机号</div>
        <div class="value">未绑定</div>
        <div class="hint">暂不支持修改绑定</div>
      </div>
      <div class="row">
        <div class="label">密码</div>
        <div class="value">***************</div>
        <div class="hint">点击此处设置新密码</div>
      </div>
      <button class="logout">退出登录</button>
    </div>
  </main>

  <div class="dim"></div>

  <div class="modal">
    <h2>修改密码</h2>
    <div class="desc">账号验证成功后，请输入至少8位数的新密码，须包含字母和数字</div>

    <div class="mlabel">手机号</div>
    <div class="input phone">
      <span class="prefix">+86</span><span class="caret"></span>
    </div>

    <div class="mlabel">验证码</div>
    <div class="verify-row">
      <div class="input"></div>
      <button class="code-btn">获取验证码</button>
    </div>

    <div class="mlabel">新密码</div>
    <div class="input pass">
      <span class="eye"><svg viewBox="0 0 24 18"><path d="M2 2c3.2 4.2 6.5 6.3 10 6.3S18.8 6.2 22 2"/><path d="M6 6.2L4.2 9"/><path d="M10 8l-.7 3.1"/><path d="M14 8l.7 3.1"/><path d="M18 6.2L19.8 9"/></svg></span>
    </div>

    <div class="mlabel">确认新密码</div>
    <div class="input pass">
      <span class="eye"><svg viewBox="0 0 24 18"><path d="M2 2c3.2 4.2 6.5 6.3 10 6.3S18.8 6.2 22 2"/><path d="M6 6.2L4.2 9"/><path d="M10 8l-.7 3.1"/><path d="M14 8l.7 3.1"/><path d="M18 6.2L19.8 9"/></svg></span>
    </div>

    <div class="actions">
      <div class="cancel">取消</div>
      <button class="confirm">确认</button>
    </div>
  </div>
</div>
</body>
</html>

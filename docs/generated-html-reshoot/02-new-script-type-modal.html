<style>
*{box-sizing:border-box}
html,body{margin:0;width:2050px;height:968px;overflow:hidden;background:#030303;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;color:#e8e8e8}
#app{position:relative;width:2050px;height:968px;background:#050505}
.sidebar{position:absolute;left:0;top:0;width:86px;height:968px;background:#050505;border-right:1px solid rgba(255,255,255,.02);z-index:1}
.logo{position:absolute;left:32px;top:42px;width:24px;height:18px}

.nav .item.active{background:#515151;color:#0d0d0d}

.bottom{position:absolute;left:18px;bottom:18px;width:52px;text-align:center}
.credits{font-weight:700;font-size:18px;color:#747474;line-height:20px;margin-bottom:32px;letter-spacing:-1px}
.credits small{font-size:10px;margin-left:1px;color:#696969}

.avatar:after{content:"";position:absolute;right:-7px;bottom:0;width:17px;height:17px;border-radius:4px;background:#3c3519;border:1px solid #76550e}
.main{position:absolute;left:86px;top:0;width:1964px;height:968px;background:
repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 6px),
#070707;border-top-left-radius:22px;border-bottom-left-radius:22px;overflow:hidden}

.search .sicon:after{content:"";position:absolute;left:15px;top:15px;width:7px;height:1.8px;background:#4a4a4a;transform:rotate(45deg);border-radius:2px}
.toplink{position:absolute;right:146px;top:43px;font-size:14px;color:#bdbdbd}
.newbtn{position:absolute;right:22px;top:28px;width:112px;height:42px;border-radius:6px;background:#151515;color:#d7d7d7;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}

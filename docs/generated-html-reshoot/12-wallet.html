<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=2050, height=968, initial-scale=1.0" />
<title>剧点</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:2050px;height:968px;overflow:hidden;background:#17181c;font-family:Arial,"Microsoft YaHei",sans-serif;color:#fff}
  .page{position:relative;width:2050px;height:968px;background:#17181c}
  .side{position:absolute;left:0;top:0;width:86px;height:968px;background:#1b1c20;color:#fff}
  .logo{position:absolute;left:32px;top:42px;width:24px;height:18px}
  .logo:before,.logo:after{content:"";position:absolute;left:0;width:24px;height:4px;background:#fff;border-radius:4px}
  .logo:before{top:0;box-shadow:0 7px 0 #fff}
  .logo:after{top:14px;width:16px}
  .nav{position:absolute;left:0;top:121px;width:86px}
  .ico{position:relative;width:86px;height:50px;margin:0 0 0 0;display:flex;align-items:center;justify-content:center;color:#fff}
  .ico svg{width:24px;height:24px;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .sep{position:absolute;left:20px;top:286px;width:46px;height:1px;background:#5b5c60}
  .nav2{position:absolute;left:0;top:315px;width:86px}
  .active{position:absolute;left:20px;top:456px;width:47px;height:47px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center}
  .active svg{width:26px;height:26px;stroke:#000;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .nav3{position:absolute;left:0;top:514px;width:86px}
  .points{position:absolute;left:18px;bottom:94px;font-size:21px;font-weight:800;color:#ddd;letter-spacing:-1px}
  .points span{font-size:12px;color:#cfcfd2;margin-left:2px}
  .avatar{position:absolute;left:24px;bottom:20px;width:42px;height:42px;border:3px solid #ff9d13;border-radius:50%;background:radial-gradient(circle at 50% 35%,#d18a42 0 14%,#1f2024 15% 100%);overflow:visible}
  .avatar:before{content:"";position:absolute;left:9px;top:8px;width:22px;height:28px;border-radius:50%;background:linear-gradient(#392619,#bd8045 38%,#5d321e);box-shadow:inset 0 -8px 0 rgba(0,0,0,.35)}
  .avatar:after{content:"";position:absolute;right:-8px;bottom:0;width:17px;height:17px;background:#ffb21a;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);border:1px solid #ffd36c}
  .main{position:absolute;left:86px;top:0;width:1964px;height:968px;border-top-left-radius:27px;background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0px,rgba(255,255,255,.035) 1px,transparent 1px,transparent 6px),
    #050505;overflow:hidden}
  .title{position:absolute;left:24px;top:37px;font-size:27px;font-weight:800;letter-spacing:1px}
  .invite{position:absolute;right:43px;top:45px;display:flex;align-items:center;font-size:14px;font-weight:700;color:#fff}
  .ticket{width:26px;height:18px;background:#ffd51b;transform:rotate(-25deg);border-radius:2px;margin-right:10px;position:relative;box-shadow:0 1px 0 #8a6d00}
  .ticket:before{content:"";position:absolute;left:9px;top:0;width:1px;height:18px;border-left:1px dashed rgba(0,0,0,.35)}
  .ticket:after{content:"";position:absolute;right:3px;top:5px;width:6px;height:6px;border-radius:50%;border:1px solid #8c7400}
  .wrap{position:absolute;left:470px;top:95px;width:1024px}
  .banner{position:relative;width:1024px;height:276px;border-radius:22px;background:#1b1c20;overflow:hidden}
  .banner:after{content:"";position:absolute;right:0;top:0;width:480px;height:276px;background:radial-gradient(circle at 88% 32%,#136a77 0,#115563 33%,#103940 62%,rgba(16,28,32,0) 100%);opacity:.96}
  .big{position:absolute;left:64px;top:38px;font-size:82px;line-height:86px;font-weight:900;letter-spacing:-8px;color:#fff}
  .coinmark{position:absolute;left:238px;top:76px;width:44px;height:38px}
  .cm1,.cm2{position:absolute;border:3px solid #bfc1c6;border-radius:50%;width:24px;height:24px;opacity:.9}
  .cm1{left:0;top:0}.cm2{left:18px;top:15px}
  .cm1:after,.cm2:after{content:"";position:absolute;left:8px;top:4px;width:4px;height:8px;border-radius:3px;background:#bfc1c6}
  .desc{position:absolute;left:64px;top:139px;font-size:16px;line-height:25px;color:#fff}
  .btns{position:absolute;left:64px;top:199px;display:flex;gap:20px}
  .btn{width:160px;height:40px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
  .btn.fill{background:linear-gradient(90deg,#ff8b19,#ffd65b);color:#fff;box-shadow:0 8px 14px rgba(45,31,115,.45)}
  .btn.out{border:1px solid #f5c842;color:#ffd54a;background:transparent;box-shadow:0 8px 14px rgba(45,31,115,.35)}
  .coins{position:absolute;right:0;top:0;width:500px;height:276px;z-index:2}
  .coin{position:absolute;border-radius:50%;background:linear-gradient(120deg,#72d2dc,#3595a8 55%,#12343e 58%,#6ec8d2 66%,#1d6070);border:2px solid rgba(55,183,200,.7);box-shadow:inset 8px 0 10px rgba(255,255,255,.18), inset -9px 0 8px rgba(0,0,0,.45),0 8px 14px rgba(0,0,0,.35)}
  .coin:after{content:"";position:absolute;left:11%;top:10%;right:12%;bottom:13%;border-radius:50%;border:3px solid rgba(12,70,84,.75);box-shadow:inset 0 0 12px rgba(255,255,255,.18)}
  .c1{width:86px;height:42px;left:190px;top:72px;transform:rotate(-28deg)}
  .c2{width:75px;height:88px;left:310px;top:20px;transform:rotate(-19deg)}
  .c3{width:73px;height:74px;left:300px;top:109px;transform:rotate(-32deg)}
  .c4{width:80px;height:52px;left:396px;top:166px;transform:rotate(86deg)}
  .c5{width:86px;height:48px;left:365px;top:153px;transform:rotate(-20deg)}
  .c6{width:99px;height:49px;left:228px;top:229px;transform:rotate(-36deg)}
  .c7{width:82px;height:102px;left:174px;top:203px;transform:rotate(-13deg)}
  .c8{width:100px;height:52px;left:274px;top:262px;transform:rotate(-16deg)}
  .task-title{position:absolute;left:470px;top:412px;font-size:14px;font-weight:700}
  .tasks{position:absolute;left:470px;top:439px;width:760px;display:flex;gap:16px}
  .card{position:relative;width:372px;height:164px;background:#1b1c20;border-radius:10px}
  .card .mini{position:absolute;left:32px;top:33px;width:32px;height:32px;border:1.5px solid #fff;border-radius:5px;display:flex;align-items:center;justify-content:center}
  .card .mini svg{width:21px;height:21px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .card h3{position:absolute;left:32px;top:82px;margin:0;font-size:24px;line-height:28px;font-weight:900}
  .card p{position:absolute;left:32px;top:113px;margin:0;font-size:16px;color:#fff}
  .check{position:absolute;right:18px;top:18px;width:22px;height:22px;border:3px solid #8bff7a;border-radius:50%}
  .check:after{content:"";position:absolute;left:5px;top:0;width:13px;height:8px;border-left:3px solid #8bff7a;border-bottom:3px solid #8bff7a;transform:rotate(-45deg)}
  .claim{position:absolute;right:17px;top:16px;width:82px;height:25px;border:1px solid #ff970d;color:#ff970d;border-radius:15px;font-size:14px;display:flex;align-items:center;justify-content:center}
  .tabs{position:absolute;left:470px;top:635px;width:122px;height:38px;background:#1b1c20;border-radius:5px;padding:4px;display:flex}
  .tab{width:51px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .tab.active-tab{background:#fff;color:#000}
  .table{position:absolute;left:470px;top:691px;width:1024px;height:108px;background:#1b1c20;border-radius:10px;overflow:hidden}
  .thead,.row{display:grid;grid-template-columns:42% 24% 34%;align-items:center}
  .thead{height:53px;border-bottom:1px solid rgba(255,255,255,.04);font-size:18px;font-weight:900}
  .row{height:55px;font-size:17px;font-weight:700}
  .cell{padding-left:32px}
  .cell:nth-child(3){text-align:right;padding-left:0;padding-right:32px}
  .thead .cell:nth-child(2),.row .cell:nth-child(2){padding-left:14px}
</style>
</head>
<body>
<div class="page">
  <aside class="side">
    <div class="logo"></div>
    <div class="nav">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M7 4h8a2 2 0 0 1 2 2v10H9a2 2 0 0 1-2-2z"/><path d="M7 8H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12"/><path d="M11 12h8a2 2 0 0 1 0 4h-8z"/></svg></div>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M14 7l3-3 3 3-3 3z"/><path d="M4 17l7-7"/><path d="M6 5l13 13"/><path d="M3 14l7 7 4-4-7-7z"/></svg></div>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M5 5v14"/><path d="M9 5v14"/><path d="M13 5l6 14"/><path d="M17 5l2 5"/></svg></div>
    </div>
    <div class="sep"></div>
    <div class="nav2">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7z"/><circle cx="12" cy="11" r="3"/><path d="M14 13l3 3"/></svg></div>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3c1 5-5 6-5 12a5 5 0 0 0 10 0c0-3-2-5-2-5"/><path d="M10 17a2 2 0 0 0 4 0"/></svg></div>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M6 4h12l4 6-10 11L2 10z"/><path d="M2 10h20"/><path d="M7 4l5 17 5-17"/></svg></div>
    </div>
    <div class="active"><svg viewBox="0 0 24 24"><path d="M4 6h15a1 1 0 0 1 1 1v12H4z"/><path d="M4 6a2 2 0 0 1 2-2h12"/><path d="M15 12h6v5h-6a2.5 2.5 0 0 1 0-5z"/><circle cx="17" cy="14.5" r=".8"/></svg></div>
    <div class="nav3">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6V20a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.2.36.4.66.6 1H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-.5 1z"/></svg></div>
    </div>
    <div class="points">1000<span>₿</span></div>
    <div class="avatar"></div>
  </aside>

  <main class="main">
    <div class="title">剧点</div>
    <div class="invite"><div class="ticket"></div>邀请有礼</div>

    <section class="wrap">
      <div class="banner">
        <div class="big">1000</div>
        <div class="coinmark"><div class="cm1"></div><div class="cm2"></div></div>
        <div class="desc">大约还能生成 <b>0</b> 篇剧本<br>查看剧点说明</div>
        <div class="btns">
          <div class="btn fill">充值剧点</div>
          <div class="btn out">企业充值</div>
        </div>
        <div class="coins">
          <div class="coin c1"></div><div class="coin c2"></div><div class="coin c3"></div><div class="coin c4"></div>
          <div class="coin c5"></div><div class="coin c6"></div><div class="coin c7"></div><div class="coin c8"></div>
        </div>
      </div>
    </section>

    <div class="task-title">剧点任务</div>
    <div class="tasks">
      <div class="card">
        <div class="mini"><svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="3"/><path d="M4 20a6 6 0 0 1 12 0"/><path d="M18 10v6"/><path d="M15 13h6"/></svg></div>
        <div class="check"></div>
        <h3>新人注册</h3>
        <p>新注册用户赠送1000剧点，自动到账</p>
      </div>
      <div class="card">
        <div class="mini"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="2"/><path d="M7 11h6"/><path d="M7 14h3"/><path d="M16 11l2 2 2-2"/><path d="M18 13v4"/></svg></div>
        <div class="claim">点击领取</div>
        <h3>剧点福利</h3>
        <p>会员每30天可免费领取500剧点，过期不可领</p>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active-tab">收入</div>
      <div class="tab">消费</div>
    </div>

    <div class="table">
      <div class="thead">
        <div class="cell">名称</div>
        <div class="cell">金额</div>
        <div class="cell">发生时间</div>
      </div>
      <div class="row">
        <div class="cell">领取1000剧点</div>
        <div class="cell">+ 1000</div>
        <div class="cell">2026年06月05日 19:48</div>
      </div>
    </div>
  </main>
</div>
</body>
</html>

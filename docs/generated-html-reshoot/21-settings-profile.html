<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2050, height=968, initial-scale=1.0">
<title>设置</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:2050px;height:968px;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#fff}
.app{width:2050px;height:968px;position:relative;background:#000;overflow:hidden}
.sidebar{position:absolute;left:0;top:0;width:86px;height:968px;background:#1b1c20}
.main{position:absolute;left:86px;top:0;width:1964px;height:968px;border-top-left-radius:26px;background-color:#030303;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0px,rgba(255,255,255,.045) 1px,transparent 1px,transparent 6px);overflow:hidden}
.title{position:absolute;left:24px;top:34px;font-size:28px;line-height:32px;font-weight:800;color:#fff;letter-spacing:-1px}
.logo{position:absolute;left:31px;top:40px;width:26px;height:22px}
.logo:before,.logo:after{content:"";position:absolute;height:6px;background:#fff;border-radius:8px}
.logo:before{width:25px;left:1px;top:0;transform:skewX(-14deg)}
.logo:after{width:23px;left:0;top:14px;transform:skewX(-14deg)}
.logo i{position:absolute;left:5px;top:7px;width:20px;height:6px;background:#fff;border-radius:8px;transform:skewX(-14deg)}
.nav{position:absolute;left:0;top:118px;width:86px}
.nav .item{width:86px;height:50px;position:relative;margin:0 0 1px 0;color:#f6f6f7}
.nav .item svg{position:absolute;left:31px;top:13px;width:24px;height:24px;stroke:#f5f5f6;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.divider{position:absolute;left:20px;top:284px;width:47px;height:1px;background:#515257}
.nav2{position:absolute;left:0;top:313px;width:86px}
.nav2 .item{width:86px;height:50px;position:relative;margin-bottom:1px}
.nav2 .item svg{position:absolute;left:31px;top:13px;width:24px;height:24px;stroke:#f5f5f6;stroke-width:2.35;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav2 .active{height:59px;margin-top:2px}
.nav2 .active .activebox{position:absolute;left:20px;top:6px;width:47px;height:47px;border-radius:6px;background:#fff}
.nav2 .active svg{left:31px;top:17px;stroke:#1c1d21;stroke-width:2.7}
.balance{position:absolute;left:18px;bottom:93px;font-size:22px;font-weight:800;color:#f0f0f2;letter-spacing:-1.8px}
.balance small{font-size:11px;vertical-align:super;margin-left:1px;color:#d6d6d9}
.miniAvatar{position:absolute;left:23px;bottom:21px;width:39px;height:39px;border-radius:50%;border:2px solid #f49a12;background:#141414;overflow:visible}
.miniAvatar:before{content:"";position:absolute;inset:2px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#b36a2a 0 11%,#2b1b13 12% 18%,transparent 19%),radial-gradient(circle at 41% 45%,#e1a56b 0 4%,#1b110d 5% 6%,transparent 7%),radial-gradient(circle at 60% 45%,#e1a56b 0 4%,#1b110d 5% 6%,transparent 7%),linear-gradient(140deg,#151515 0 25%,#d89119 26% 49%,#5c3516 50% 100%)}
.miniAvatar:after{content:"";position:absolute;right:-7px;bottom:0;width:13px;height:13px;border-radius:50%;background:#ffc038;border:1px solid #d88d08}
.tabs{position:absolute;left:557px;top:99px;width:353px;height:36px;background:#1d1e23;border-radius:4px;padding:4px;display:flex;align-items:center}
.tab{height:28px;padding:0 13px;border-radius:3px;color:#fff;font-size:15px;font-weight:600;line-height:28px;margin-right:9px;white-space:nowrap}
.tab.active{background:#fff;color:#111;margin-right:10px}
.profile{position:absolute;left:557px;top:171px;width:355px}
.avatar{position:absolute;left:0;top:0;width:116px;height:116px;border-radius:50%;overflow:hidden;background:#111}
.avatar svg{width:116px;height:116px;display:block}
.form{position:absolute;left:0;top:152px;width:355px}
.label{font-size:14px;color:#fff;font-weight:500;line-height:20px;margin-bottom:6px}
.input{width:354px;height:37px;border-radius:3px;background:#191a1f;color:#fff;font-size:15px;font-weight:800;line-height:37px;padding-left:14px}
</style>
</head>
<body>

      </div>
